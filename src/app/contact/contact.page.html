<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Contact</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Contact</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-list-header>Feedback</ion-list-header>
    <ion-item href="https://github.com/fahdi/unfollowers/issues" target="_blank" rel="noopener">
      <ion-icon name="logo-github" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>Open an issue on GitHub</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
